# Manual: re-run every evaluation script and upload the tables, so the numbers in the README can be checked on a clean machine.
# Results are seeded but may differ in the last digit across platforms, so this uploads them rather than failing on a diff.
name: reproduce results
on:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas numpy pyarrow matplotlib pyyaml pytest
      - run: pytest -q
      - run: |
          export PYTHONPATH=.
          python scripts/phase3_eval.py
          python scripts/phase4_eval.py
          python scripts/phase5_demo.py
          python scripts/phase6_eval.py
          python scripts/phase7_eval.py
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            docs/detector_scores.*
            docs/eod_scores.*
            docs/recorder_demo.json
            docs/phase6_*
            docs/phase7_*
