# Every threshold, ratio, session time and cost lives here. No magic numbers in code.
market:
  timezone: Asia/Kolkata
  preopen_start: "09:00"
  preopen_end: "09:08"
  session_open: "09:15"      # NSE cash session
  session_close: "15:30"

instrument:
  # FALLBACK ONLY, used by synthetic data and tests. Real runs must read the tick size
  # per instrument from the broker's instrument master (it varies by price band).
  default_tick_size: 0.05

bars:
  time_bar_freq: "5min"
  footprint_row_ticks: 1     # footprint price row = this many ticks (must be integer multiple)
  demo_footprint_row_ticks: 10   # coarser rows so wide-range demo charts stay readable
  tick_bar_size: 500
  volume_bar_size: 20000

classify:
  quote_price_eps_ticks: 0.001   # float tolerance when comparing price to quote, in ticks

delta:
  swing_left: 3               # bars to the left a swing must exceed
  swing_right: 3              # bars to the right that CONFIRM a swing (signal known only then)
  flip_min_abs_pct: 0.15      # both bars need |delta%| at least this for a delta flip
  no_progress_min_abs_pct: 0.20
  no_progress_max_move_ticks: 5   # close-open in the delta direction no more than this

footprint:
  imbalance_ratio: 3.0
  imbalance_min_volume: 10
  stacked_min_levels: 3

profile:
  value_area_pct: 0.70
  row_ticks: 10               # profile row size in ticks
  smooth_rows: 3              # moving-average window for HVN/LVN detection
  hvn_min_frac: 0.60          # HVN: smoothed peak >= this share of the max
  lvn_max_frac: 0.35          # LVN: smoothed valley <= this share of the max
  double_min_sep_frac: 0.25   # two HVNs this far apart (share of rows) ...
  double_valley_frac: 0.70    # ... with a valley below this share of the lower peak = double distribution
  pb_mass_frac: 0.50          # P/b: share of volume in the upper/lower third
  d_mid_frac: 0.50            # D: share of volume in the middle third
  d_sym: 0.20                 # D: |upper share - lower share| at most this
  thin_min_rows: 12
  thin_poc_share: 0.08        # thin profile: POC holds at most this share of volume

tpo:
  period_min: 30
  row_ticks: 10
  ib_periods: 2               # initial balance = first hour
  poor_min_tpos: 2            # poor high/low: extreme row has at least this many letters
  single_print_min_rows: 3
  excess_min_rows: 2          # excess/tail: this many single-print rows at an extreme

open_type:                    # heuristics TO BE TESTED, not facts
  window_min: 30
  drive_net_frac: 0.70
  drive_counter_frac: 0.15
  test_counter_max_frac: 0.35
  reverse_net_frac: 0.50

vwap:
  band_mults: [1.0, 2.0]

synthetic:
  seed: 42
  start_price: 1000.0
  events_per_min: 40          # mean trade arrival rate in normal regime
  buy_prob_normal: 0.5
  move_prob_normal: 0.06      # chance per trade the quote re-centres by one tick (random walk)
  wide_spread_prob: 0.15      # chance spread is 2 ticks instead of 1 after a reprice
  trade_qty_median: 50
  trade_qty_sigma: 0.9
  depth_median: 400
  depth_sigma: 0.7
  quote_refresh_prob: 0.20    # chance displayed sizes are re-drawn between trades
  stale_quote_prob: 0.15      # chance the quote attached to a trade is the previous event's (latency)
  burst_buy_prob: 0.90
  burst_qty_mult: 4.0
  burst_intensity_mult: 3.0
  absorb_aggressor_prob: 0.85 # share of aggressive flow into the absorbed side
  absorb_qty_mult: 2.5
  absorb_intensity_mult: 2.0
  absorb_refill_mult: 8.0     # passive refill size as a multiple of depth_median
  # ---- Phase 3: order book and book events (all toy values) ----
  book_levels: 5              # depth levels recorded per side (NSE feeds typically give 5)
  book_snapshot_sec: 1.0      # also snapshot at least this often when no trade happens
  deep_depth_mult: 1.2        # deeper levels are this much larger on average
  iceberg_disclosed: 150      # displayed (disclosed) quantity of the iceberg order
  iceberg_total: 500000       # hidden total behind it
  spoof_mult: 15              # spoof order size as a multiple of depth_median
  spoof_interval_s: 30        # new spoof placed at least this long after the previous pull
  spoof_max_life_s: 20        # pulled at the latest after this
  spoof_pull_dist_ticks: 1    # pulled when the best price is this close to it
  spoof_buy_prob: 0.30        # sell-biased drift so price approaches a bid spoof (mirror for ask)
  wall_mult: 25               # genuine wall size as a multiple of depth_median (never pulled)
  wall_buy_prob: 0.65         # buy-biased drift toward an ask wall (mirror for bid)
  dry_up_intensity_mult: 0.25 # trade rate multiplier in the dry-up phase of an exhaustion
  n_large_prints: 0           # injected single large trades per day (0 = none)
  large_print_mult: 40        # injected qty = this x trade_qty_median x U(1, 1.5)
  # Labelled events, minutes after session open. kinds: burst_up, burst_down,
  # absorption_bid, absorption_ask, sweep_reversal (down-burst -> absorption -> up-burst)
  # Phase 3 kinds (used by eval days): iceberg_bid/ask, spoof_bid/ask, wall_bid/ask, exhaustion_up/down,
  # trap_reversal_up (burst_up -> absorption_ask -> burst_down)
  schedule:
    - {kind: burst_up,        at_min: 45,  dur_min: 6}
    - {kind: absorption_bid,  at_min: 120, dur_min: 10}
    - {kind: sweep_reversal,  at_min: 210, dur_min: 15}
    - {kind: absorption_ask,  at_min: 300, dur_min: 10}

book:                         # Phase 3: order-book analytics (rules in book.py docstrings)
  imbalance_levels: 3
  baseline_minutes: 5         # "typical" level size = median of the previous N minutes
  baseline_warmup_min: 5      # no large-order tracking before this (no baseline yet)
  wall_min_mult: 10           # a large order is >= this x the typical displayed level size
  wall_min_s: 3               # a wall must survive this long
  wall_min_level: 1           # 0-based level where it is first seen (1 = second level or deeper)
  hysteresis: 0.5             # an episode ends when size falls below this share of the threshold
  pull_traded_frac: 0.05      # "pulled" = less than this share of its size traded at its price
  spoof_min_start_level: 2    # spoof-like: first seen at least this deep (0 = best)
  spoof_max_life_s: 60        # ... and pulled within this time
  iceberg_refill_min_frac: 0.5
  iceberg_min_refills: 5
  iceberg_min_exec_ratio: 5   # executed >= this x the displayed size
  iceberg_cv_max: 0.10        # displayed size after each refill must be almost constant
  iceberg_gap_s: 60           # a new run starts after this long without a trade at the price

events:                       # Phase 3: event detectors (calibrated on separate synthetic days)
  large_print_mult: 30
  large_print_lookback: 200
  absorb_step_s: 15
  absorb_window_s: 120
  absorb_min_delta_frac: 0.5
  absorb_max_range_ticks: 6
  absorb_min_volume_mult: 2.0
  absorb_warmup_windows: 20
  exhaust_bar_freq: "1min"
  exhaust_lookback_bars: 10
  exhaust_tol_ticks: 6
  exhaust_peak_mult: 3.0
  exhaust_dry_frac: 0.5
  exhaust_warmup_bars: 15
  trap_window_min: 10
  trap_step_s: 60
  trap_cluster_s: 120
  trap_near_ticks: 10
  trap_recovery_ticks: 30
  trap_min_age_min: 1
  trap_min_vol_mult: 3.0
  trap_min_share: 0.15
  trap_warmup_min: 15
  flip_bar_freq: "1min"
  flip_min_abs_pct: 0.4
  flip_min_vol_frac: 0.5
  flip_warmup_bars: 15

eval:
  calibration_seed_base: 500   # thresholds are tuned ONLY on these days
  heldout_seed_base: 9000      # reported scores come ONLY from these days
  n_calibration_days: 6
  n_heldout_days: 20
  episode_gap_s: 60
  grace_min: 2.0

# NSE cost model. RATES CHANGE: verify every number against the current broker charge
# sheet and exchange/SEBI circulars before trusting any backtest. Applied from Phase 6.
costs:
  intraday:
    brokerage_pct: 0.03
    brokerage_cap_per_order: 20.0
    stt_sell_pct: 0.025
    exchange_txn_pct: 0.00297
    sebi_pct: 0.0001
    stamp_buy_pct: 0.003
    gst_pct: 18.0            # on brokerage + exchange txn + SEBI
    slippage_ticks: 1
  delivery:
    brokerage_pct: 0.0
    brokerage_cap_per_order: 0.0
    stt_buy_pct: 0.1
    stt_sell_pct: 0.1
    exchange_txn_pct: 0.00297
    sebi_pct: 0.0001
    stamp_buy_pct: 0.015
    gst_pct: 18.0
    slippage_ticks: 1

# ---- Phase 4: end-of-day (EOD) order-flow proxies --------------------------------------------------------
eod:
  swing_left: 3
  swing_right: 3
  vol_lookback: 20            # baseline = the PREVIOUS this-many days (never includes the current day)
  vol_warmup: 10
  deliv_lookback: 20
  deliv_warmup: 10
  atr_lookback: 14
  pos_lookback: 20            # prior-days range used to say whether a day sits near a low or a high
  effort_vol_z: 1.0           # "effort": log-volume z-score at least this
  effort_deliv_z: 0.8         # delivery % z-score at least this (needs a delivery column)
  effort_range_atr: 0.7       # "no result": day range <= this x prior ATR
  pos_low_max: 0.35           # close within the lowest 35% of the prior range -> absorption_at_low
  pos_high_min: 0.65
  swing_heavy_vol_z: 1.0
  swing_heavy_deliv_z: 0.8

synthetic_eod:                # TOY data for tests and teaching. NOT market data.
  seed: 7
  n_days: 600
  start_date: "2020-01-01"
  start_price: 1000.0
  daily_vol_pct: 1.2
  gap_pct: 0.3
  base_volume: 1000000
  volume_logsd: 0.25
  base_deliv_pct: 45.0
  deliv_sd: 5.0
  n_episodes: 12
  episode_len: 4
  lead_in_days: 12
  lead_in_drift_pct: 0.6      # per-day drift before an episode (down before a low, up before a high)
  episode_vol_mult: 2.5
  episode_range_mult: 0.35
  episode_deliv_add: 15.0

eod_eval:
  calibration_seed_base: 300
  heldout_seed_base: 7000
  n_calibration_series: 6
  n_heldout_series: 20
  grace_days: 1
  gap_days: 2                 # detections closer than this many days belong to one episode

# ---- Phase 5: live recorder (stores what the feed sends; never invents rows) -------------------------------
recorder:
  store_root: data/store
  flush_rows: 5000            # write a parquet part after this many buffered rows
  book_snapshot_sec: 1.0      # keep at most one book snapshot per this many seconds
  book_levels: 5
  gap_alert_s: 30             # in-session silence longer than this is logged as a gap
  schema_version: 1

# ---- Phase 6: setups, backtest, rule harnesses -----------------------------------------------------------
backtest:
  product: intraday
  qty: 100                    # shares per trade (fixed; no compounding)
  bar_freq: "1min"
  max_hold_min: 45
  flat_before_close_min: 10   # force-exit this many minutes before the session close
  both_hit_rule: stop         # stop and target inside one bar: assume the STOP was hit first (conservative)
  bootstrap_n: 2000
  bootstrap_seed: 11

setups:
  stop_lookback_min: 10       # stop beyond the extreme of this many prior minutes
  stop_buffer_ticks: 2
  min_risk_ticks: 8
  target_r: 1.5
  cooldown_min: 5             # ignore new signals this long after a signal of the same setup
  eval_calibration_seed_base: 800
  eval_heldout_seed_base: 9500
  n_calibration_days: 6
  n_heldout_days: 30

rules:
  value_area_pct: 0.70
  profile_row_ticks: 1
  period_freq: "30min"        # acceptance is judged on closes of bars of this length
  accept_periods: 2           # consecutive period closes inside the prior value area = "accepted"
  open_outside_ticks: 1       # open must be at least this far outside the prior value area
  claimed_probability: 0.80
  toy_gap_pct: 0.4            # toy only: random overnight gap applied to synthetic days
  gap_buckets_pct: [0.0, 0.2, 0.5, 1.0]

# ---- Phase 7: ICT bridge (order-flow evidence for an ict-swing-engine entry) ------------------------------
bridge:
  min_history_days: 40        # fewer daily bars than this up to as_of -> verdict "no_data"
  lookback_days: 15           # an effort / swing-flow event counts if it falls in this many days before as_of
  swing_match_days: 5         # the swing low/high must lie within this many days of the sweep date
  flow_days: 5                # days used for the net estimated-delta ratio
  flow_ratio_min: 0.15        # |sum(delta_est) / sum(volume)| at least this counts as support or contradiction
  confirm_min_score: 2        # score >= this -> confirm
  reject_min_score: 2         # score <= -this -> reject
  intraday_pad_min: 30        # intraday evidence window starts this long before the sweep
